services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: masstransit-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: masstransit-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: masstransit-mongodb
    ports:
      - "27017:27017"
    restart: unless-stopped
